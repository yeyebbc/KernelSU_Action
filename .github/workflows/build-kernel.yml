name: Build H8116 Kernel
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build H8116 (aurora) kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      # The dedicated, self-contained build tools directory.
      WS: ${{ github.workspace }}/kernel_workspace
    steps:
    - uses: actions/checkout@v4

    - name: Load build configuration
      run: |
        set -euo pipefail
        # config.env is valid bash (sourced directly). It stays the single source
        # of truth for source refs, toolchain and packaging interface.
        . "$GITHUB_WORKSPACE/config.env"
        # Export scalars so the checkout/source-based values are visible to later steps.
        for v in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_SOURCE_COMMIT \
                 KERNEL_CONFIG KERNEL_IMAGE_NAME ARCH EXPECTED_KERNEL_RELEASE \
                 CLANG_SOURCE CLANG_BRANCH CLANG_RELEASE CLANG_TRIPLE LINKER \
                 GCC_64_SOURCE GCC_32_SOURCE GCC_TAG GCC_64_PREFIX GCC_32_PREFIX \
                 KSU_SOURCE KSU_COMMIT \
                 MKBOOTIMG_SOURCE AVB_SOURCE TOOLS_BRANCH MKBOOTIMG_COMMIT AVB_COMMIT \
                 SOURCE_BOOT_IMAGE SOURCE_DTBO_IMAGE \
                 PACKAGING_TOOLS PACKAGING_AVBTOOL PACKAGING_KERNEL PACKAGING_OUTPUT; do
          printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
        done
        # KSU flags array is expanded here (arrays cannot cross GITHUB_ENV).
        printf 'KSU_FLAGS=%s\n' "${KSU_FLAGS[*]}" >> "$GITHUB_ENV"
        printf 'BUILD_TIME=%s\n' "$(TZ=UTC date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
        echo "Kernel: $KERNEL_SOURCE @ $KERNEL_SOURCE_BRANCH ($KERNEL_SOURCE_COMMIT)"
        echo "Config: $KERNEL_CONFIG -> $KERNEL_IMAGE_NAME (release $EXPECTED_KERNEL_RELEASE)"
        echo "Clang:  $CLANG_RELEASE on $CLANG_BRANCH; KSU @ $KSU_COMMIT"

    - name: Install build packages
      run: |
        set -euo pipefail
        # Ubuntu 22.04 host toolchain needed by a 4.9 Android kernel + mkbootimg/avb.
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          git make bc bison flex build-essential \
          libssl-dev libelf-dev device-tree-compiler \
          python3 curl \
          cpio xz-utils zstd libtinfo5 libncurses5 \
          libncurses-dev zlib1g-dev \
          >/dev/null
        echo "Installed build packages."

    - name: Fetch AOSP clang (r536225 / clang 19.0.1)
      run: |
        set -euo pipefail
        mkdir -p "$WS/clang-aosp"
        cd "$WS/clang-aosp"
        # clang-r536225 is only on the master branch (not frozen kernel-build-*).
        curl -fsSL "$CLANG_SOURCE/+archive/refs/heads/$CLANG_BRANCH/$CLANG_RELEASE.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz
        rm -f clang.tar.gz
        bin/clang --version
        bin/ld.lld --version

    - name: Fetch AOSP GCC prebuilts (binutils + compat vDSO toolchains)
      run: |
        set -euo pipefail
        # 64-bit aarch64 cross binutils (as/ld/elfedit) for clang's -no-integrated-as.
        mkdir -p "$WS/gcc-64"
        curl -fsSL "$GCC_64_SOURCE/+archive/refs/tags/$GCC_TAG.tar.gz" -o "$WS/gcc-64.tar.gz"
        tar -C "$WS/gcc-64" -xzf "$WS/gcc-64.tar.gz" && rm -f "$WS/gcc-64.tar.gz"
        test -x "$WS/gcc-64/bin/${GCC_64_PREFIX}elfedit"
        # 32-bit arm cross toolchain for CONFIG_COMPAT_VDSO (CONFIG_COMPAT=y).
        mkdir -p "$WS/gcc-32"
        curl -fsSL "$GCC_32_SOURCE/+archive/refs/tags/$GCC_TAG.tar.gz" -o "$WS/gcc-32.tar.gz"
        tar -C "$WS/gcc-32" -xzf "$WS/gcc-32.tar.gz" && rm -f "$WS/gcc-32.tar.gz"
        test -x "$WS/gcc-32/bin/${GCC_32_PREFIX}ld"
        echo "AOSP GCC 64/32 prebuilts extracted."

    - name: Fetch mkbootimg + avb tools (android15-release)
      run: |
        set -euo pipefail
        # AOSP mkbootimg tools (for unpacking --source and rebuilding the boot image).
        mkdir -p "$WS/tools"
        curl -fsSL "$MKBOOTIMG_SOURCE/+archive/$MKBOOTIMG_COMMIT.tar.gz" -o "$WS/tools.tar.gz"
        tar -C "$WS/tools" -xzf "$WS/tools.tar.gz" && rm -f "$WS/tools.tar.gz"
        test -f "$WS/tools/mkbootimg.py" && test -f "$WS/tools/unpack_bootimg.py"
        # AOSP avb rebuilds the unsigned AVB hash footer.
        mkdir -p "$WS/avb"
        curl -fsSL "$AVB_SOURCE/+archive/$AVB_COMMIT.tar.gz" -o "$WS/avb.tar.gz"
        tar -C "$WS/avb" -xzf "$WS/avb.tar.gz" && rm -f "$WS/avb.tar.gz"
        test -f "$WS/avb/avbtool.py"
        echo "mkbootimg + avb (android15-release) fetched."

    - name: Fetch kernel source (LineageOS 22.2 SDM845)
      run: |
        set -euo pipefail
        git clone --single-branch "$KERNEL_SOURCE" "$WS/android-kernel" -b "$KERNEL_SOURCE_BRANCH"
        git -C "$WS/android-kernel" checkout -q "$KERNEL_SOURCE_COMMIT"
        head -n4 "$WS/android-kernel/Makefile"
        echo "Kernel source pinned to $KERNEL_SOURCE_COMMIT."

    - name: Setup KernelSU (backslashxx fork, pinned)
      run: |
        set -euo pipefail
        KERNEL_DIR="$WS/android-kernel"
        # Clone the fork so setup.sh reuses it (it skips its own clone when the
        # directory exists). Leave it on the default master branch so setup.sh's
        # `git pull` succeeds; setup.sh then checks out the exact pinned commit.
        git clone "$KSU_SOURCE" "$KERNEL_DIR/KernelSU"
        # Run the fork's own setup.sh against the exact commit (never a tag fallback).
        # setup.sh's `|| echo "Checkout default branch"` swallows a bad checkout, so
        # we MUST verify HEAD afterwards and fail on any fallback.
        git -C "$KERNEL_DIR/KernelSU" show "$KSU_COMMIT:kernel/setup.sh" > "$WS/ksu-setup.sh"
        ( cd "$KERNEL_DIR" && bash "$WS/ksu-setup.sh" "$KSU_COMMIT" )
        # Verify HEAD is the pinned commit; fail on any fallback.
        ACTUAL_HEAD=$(git -C "$KERNEL_DIR/KernelSU" rev-parse HEAD)
        if [ "$ACTUAL_HEAD" != "$KSU_COMMIT" ]; then
          echo "ERROR: KernelSU fallback detected. HEAD=$ACTUAL_HEAD expected=$KSU_COMMIT" >&2
          exit 1
        fi
        echo "KernelSU HEAD verified: $ACTUAL_HEAD"
        # Verify the hook-mode wiring the fork expects for 4.9.
        grep -q "kernelsu" "$KERNEL_DIR/drivers/Makefile" || { echo "kernelsu not in drivers/Makefile" >&2; exit 1; }
        grep -q "drivers/kernelsu/Kconfig" "$KERNEL_DIR/drivers/Kconfig" || { echo "kernelsu Kconfig not sourced" >&2; exit 1; }

    - name: Configure kernel (.config)
      run: |
        set -euo pipefail
        KERNEL_DIR="$WS/android-kernel"
        GCC_64="$WS/gcc-64/bin/${GCC_64_PREFIX}"
        GCC_32="$WS/gcc-32/bin/${GCC_32_PREFIX}"
        export PATH="$WS/clang-aosp/bin:$WS/gcc-64/bin:$WS/gcc-32/bin:$PATH"
        # base defconfig
        ( cd "$KERNEL_DIR" && make O=out ARCH="$ARCH" CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$GCC_64" \
            CROSS_COMPILE_ARM32="$GCC_32" \
            LD="$LINKER" \
            LOCALVERSION= \
            "$KERNEL_CONFIG" )
        # Release string: keep -perf+ and suppress the SCM '+' (LOCALVERSION_AUTO off,
        # LOCALVERSION= empty set on the command line suppresses scm_version --short +).
        ( cd "$KERNEL_DIR" && scripts/config --file out/.config \
            --set-str LOCALVERSION '-perf+' \
            --disable LOCALVERSION_AUTO )
        # Clang 19 defaults to DWARF 5, which the GCC 4.9 prebuilts' gas
        # cannot assemble. Keep debug info using the supported DWARF 4 format.
        ( cd "$KERNEL_DIR" && scripts/config --file out/.config \
            --enable DEBUG_INFO_DWARF4 )
        # KernelSU 4.9 recommended flags: tamper syscall table + LSM security hooks + KSU.
        for flag in $KSU_FLAGS; do
          ( cd "$KERNEL_DIR" && scripts/config --file out/.config --enable "$flag" )
        done
        # Bake all symbols (incl. new KSU Kconfig) non-interactively with defaults,
        # preserving our explicitly-set flags, so the real build never prompts.
        ( cd "$KERNEL_DIR" && make O=out ARCH="$ARCH" CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$GCC_64" \
            CROSS_COMPILE_ARM32="$GCC_32" \
            LD="$LINKER" \
            LOCALVERSION= \
            olddefconfig )
        grep -qx 'CONFIG_DEBUG_INFO_DWARF4=y' "$KERNEL_DIR/out/.config" || {
          echo "ERROR: DWARF 4 is required by the legacy assembler" >&2
          exit 1
        }
        echo "--- KSU/LOCALVERSION lines in .config ---"
        grep -E "CONFIG_(KSU|LOCALVERSION)" "$KERNEL_DIR/out/.config" || true

    - name: Build kernel (Image.gz-dtb)
      run: |
        set -euo pipefail
        KERNEL_DIR="$WS/android-kernel"
        GCC_64="$WS/gcc-64/bin/${GCC_64_PREFIX}"
        GCC_32="$WS/gcc-32/bin/${GCC_32_PREFIX}"
        export PATH="$WS/clang-aosp/bin:$WS/gcc-64/bin:$WS/gcc-32/bin:$PATH"
        export KBUILD_BUILD_USER=github-actions
        export KBUILD_BUILD_HOST=github-actions
        MAKE_COMMON=(
          O=out
          ARCH="$ARCH"
          CC=clang
          CLANG_TRIPLE="$CLANG_TRIPLE"
          CROSS_COMPILE="$GCC_64"
          CROSS_COMPILE_ARM32="$GCC_32"
          LD="$LINKER"
          LOCALVERSION=
        )
        ( cd "$KERNEL_DIR" && make -j"$(nproc)" "${MAKE_COMMON[@]}" )
        echo "Kernel build complete."

    - name: Verify kernel outputs
      run: |
        set -euo pipefail
        KERNEL_DIR="$WS/android-kernel"
        IMG="$KERNEL_DIR/out/arch/${ARCH}/boot/${KERNEL_IMAGE_NAME}"
        test -s "$IMG" || { echo "ERROR: $KERNEL_IMAGE_NAME missing or empty" >&2; exit 1; }
        # Release string must be exactly 4.9.337-perf+.
        RELEASE=$(cat "$KERNEL_DIR/out/include/config/kernel.release")
        echo "Kernel release: $RELEASE"
        test "$RELEASE" = "$EXPECTED_KERNEL_RELEASE" || { echo "ERROR: release '$RELEASE' != '$EXPECTED_KERNEL_RELEASE'" >&2; exit 1; }
        # Selected flags must survive the build's syncconfig.
        grep -q '^CONFIG_KSU=y' "$KERNEL_DIR/out/.config" || { echo "CONFIG_KSU not y" >&2; exit 1; }
        grep -q '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' "$KERNEL_DIR/out/.config" || { echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE not y" >&2; exit 1; }
        grep -q '^CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$KERNEL_DIR/out/.config" || { echo "CONFIG_KSU_LSM_SECURITY_HOOKS not y" >&2; exit 1; }
        grep -q '^CONFIG_LOCALVERSION="-perf+"' "$KERNEL_DIR/out/.config" || { echo "CONFIG_LOCALVERSION not -perf+" >&2; exit 1; }
        grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' "$KERNEL_DIR/out/.config" || { echo "LOCALVERSION_AUTO not disabled" >&2; exit 1; }
        echo "Image: $IMG ($(stat -c%s "$IMG") bytes)"

    - name: Package boot image (repack_boot.py)
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        # Keep the reference DTBO unchanged; only the boot kernel is replaced.
        mkdir -p kernel_workspace/dist
        cp -f "$SOURCE_DTBO_IMAGE" kernel_workspace/dist/dtbo.img
        # Packaging paths are repository-relative.
        python3 scripts/repack_boot.py \
          --tools "$GITHUB_WORKSPACE/$PACKAGING_TOOLS" \
          --avbtool "$GITHUB_WORKSPACE/$PACKAGING_AVBTOOL" \
          --source "$SOURCE_BOOT_IMAGE" \
          --kernel "$GITHUB_WORKSPACE/$PACKAGING_KERNEL" \
          --output "$GITHUB_WORKSPACE/$PACKAGING_OUTPUT"
        test -f kernel_workspace/dist/boot.img || { echo "boot.img not produced" >&2; exit 1; }
        echo "boot.img: $(stat -c%s kernel_workspace/dist/boot.img) bytes"
        echo "dtbo.img: $(stat -c%s kernel_workspace/dist/dtbo.img) bytes"

    - name: Record build provenance
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        KERNEL_DIR="$WS/android-kernel"
        KSU_HEAD=$(git -C "$KERNEL_DIR/KernelSU" rev-parse HEAD)
        REL=$(cat "$KERNEL_DIR/out/include/config/kernel.release")
        {
          echo "build_time=$BUILD_TIME"
          echo "kernel_source=$KERNEL_SOURCE"
          echo "kernel_branch=$KERNEL_SOURCE_BRANCH"
          echo "kernel_commit=$KERNEL_SOURCE_COMMIT"
          echo "kernel_defconfig=$KERNEL_CONFIG"
          echo "kernel_release=$REL"
          echo "clang=$CLANG_RELEASE@$CLANG_BRANCH"
          echo "gcc_tag=$GCC_TAG"
          echo "gcc_64_prefix=$GCC_64_PREFIX"
          echo "gcc_32_prefix=$GCC_32_PREFIX"
          echo "ksu_source=$KSU_SOURCE"
          echo "ksu_commit=$KSU_HEAD"
          echo "mkbootimg_commit=$MKBOOTIMG_COMMIT"
          echo "avb_commit=$AVB_COMMIT"
        } > kernel_workspace/dist/build-info.txt
        cp -f config.env kernel_workspace/dist/config.env
        cp -f "$KERNEL_DIR/out/.config" kernel_workspace/dist/kernel.config
        echo "Provenance written."

    - name: Upload H8116 boot image and provenance
      uses: actions/upload-artifact@v4
      with:
        name: h8116-lineage22-kernelsu-${{ github.run_number }}
        if-no-files-found: error
        path: kernel_workspace/dist/

  release:
    name: Publish H8116 release
    if: always() && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-22.04
    concurrency:
      group: h8116-release
      cancel-in-progress: false
    permissions:
      contents: write
      # The build job downloads sources without needing a token.
      # A release relies on GITHUB_TOKEN and cannot access workflow `secrets`.
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: h8116-lineage22-kernelsu-${{ github.run_number }}
        path: dist

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: h8116-${{ github.run_number }}
        name: H8116 KernelSU ${{ github.run_number }}
        generate_release_notes: false
        body: |
          KernelSU boot image for Sony Xperia XZ2 Premium (H8116), LineageOS 22 / Android 15.
          Flash the boot image; no AnyKernel3 installer. Unlocked bootloader required.
          On-device boot and KernelSU functionality are NOT verified.
        files: dist/boot.img dist/dtbo.img dist/build-info.txt dist/config.env dist/kernel.config
